#
# Karacast Mobil veröffentlichen — wie „Veröffentlichen“ für die TV-App, nur für
# die Handy-App (Modul mobile/): APK bauen und signieren, als Release anhängen,
# update/karacast-mobile.json umschreiben. Die Handys lesen nur diese Datei.
#
# Auslöser: ein Tag `mobile-v1.0.0` (muss zur versionName in
# mobile/build.gradle.kts passen) oder „Run workflow“ unter Actions.
#
# Der Signaturschlüssel ist derselbe wie bei der TV-App (dieselben Secrets).
# Das Release wird nicht als „Latest“ markiert: das bleibt die TV-App.
#
name: Karacast Mobil veröffentlichen

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      notes:
        description: 'Was ist neu? (wird am Handy angezeigt)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-mobile
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version aus build.gradle.kts lesen
        id: version
        run: |
          set -euo pipefail
          file=mobile/build.gradle.kts
          name=$(grep -m1 -E '^\s*versionName\s*=' "$file" | sed -E 's/.*"([^"]+)".*/\1/')
          code=$(grep -m1 -E '^\s*versionCode\s*=' "$file" | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::versionName/versionCode nicht gefunden in $file"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=mobile-v$name"  >> "$GITHUB_OUTPUT"
          echo "Version $name ($code)"

      - name: Tag und Version müssen zusammenpassen
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          want="${{ steps.version.outputs.tag }}"
          if [ "$tag" != "$want" ]; then
            echo "::error::Tag $tag, aber mobile/build.gradle.kts sagt $want. Erst die Version hochzählen, dann taggen."
            exit 1
          fi

      - name: Ist die Version überhaupt neuer?
        run: |
          set -euo pipefail
          alt=$(python3 -c "import json;print(json.load(open('update/karacast-mobile.json'))['versionCode'])" 2>/dev/null || echo 0)
          neu=${{ steps.version.outputs.code }}
          if [ "$neu" -le "$alt" ]; then
            echo "::error::versionCode $neu ist nicht größer als der veröffentlichte ($alt). Kein Handy würde das Update sehen."
            exit 1
          fi

      - name: Signaturschlüssel bereitlegen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Das Secret KEYSTORE_BASE64 fehlt. Ohne den eigenen Schlüssel würde das APK mit dem Debug-Schlüssel signiert — solche Updates lassen sich nicht über eine bestehende Installation legen."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/safir-release.jks
          # Die Properties-Datei entsteht hier und nur hier; im Repository hat
          # sie nichts verloren und steht deshalb in .gitignore.
          {
            printf 'storeFile=keystore/safir-release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          echo "Schlüssel liegt bereit ($(stat -c%s keystore/safir-release.jks) Bytes)."

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Release-APK bauen
        run: ./gradlew :mobile:assembleDirectRelease --no-daemon --stacktrace

      - name: APK prüfen und benennen
        id: apk
        run: |
          set -euo pipefail
          # Die APK-Fassung ("direct"); die Play-Fassung geht als Bundle an Google.
          src=mobile/build/outputs/apk/direct/release/mobile-direct-release.apk
          if [ ! -f "$src" ]; then
            echo "::error::$src wurde nicht gebaut."
            exit 1
          fi

          # Zwei Prüfungen, beide schon einmal teuer bezahlt:
          # 1. testOnly — so ein APK lässt sich von Hand nicht installieren
          #    ("Paket ungültig"). Gradle setzt das nicht, Android Studio beim
          #    Ausführen schon; wenn es hier auftaucht, stimmt etwas nicht.
          unzip -p "$src" AndroidManifest.xml > /tmp/manifest.bin
          # Der Name steht im Zeichenvorrat der Binärdatei — je nach Werkzeug
          # als ASCII oder als UTF-16, deshalb beide Lesarten.
          if { strings -a /tmp/manifest.bin; strings -a -el /tmp/manifest.bin; } | grep -q 'testOnly'; then
            echo "::error::Das APK ist als testOnly markiert und wäre nicht installierbar."
            exit 1
          fi
          # 2. Wer hat signiert? Der Debug-Schlüssel heißt immer "Android Debug".
          unzip -p "$src" META-INF/'*.RSA' > /tmp/sig.rsa 2>/dev/null || true
          if keytool -printcert -file /tmp/sig.rsa 2>/dev/null | grep -q 'Android Debug'; then
            echo "::error::Mit dem Debug-Schlüssel signiert — das wäre kein gültiges Update."
            exit 1
          fi

          mkdir -p dist
          out="dist/KaracastMobil-${{ steps.version.outputs.name }}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$out")" >> "$GITHUB_OUTPUT"
          ls -lh "$out"

      - name: Was ist neu?
        id: notes
        env:
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          set -euo pipefail
          text="${NOTES:-}"
          if [ -z "$text" ] && [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            tag="${GITHUB_REF#refs/tags/}"
            # Bei einem beschrifteten Tag steht der Text im Tag selbst. Aber:
            # actions/checkout legt den Tag als „leichten“ Tag an, der nur auf
            # den Commit zeigt — der Text ginge verloren, und es käme der Titel
            # des letzten Commits heraus (so geschehen bei 1.12.0). Deshalb den
            # Tag selbst noch einmal holen, mitsamt seiner Beschriftung.
            git fetch --force --no-tags origin "+refs/tags/${tag}:refs/tags/${tag}"
            if [ "$(git cat-file -t "$tag")" = "tag" ]; then
              text=$(git tag -l --format='%(contents:subject)' "$tag")
            fi
          fi
          [ -n "$text" ] || text="Version ${{ steps.version.outputs.name }}"
          # Über eine Datei, damit Zeilenumbrüche und Anführungszeichen überleben.
          printf '%s' "$text" > /tmp/notes.txt
          echo "Notiz: $text"

      - name: Release anlegen und APK anhängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create "$tag" "${{ steps.apk.outputs.path }}" \
              --target "${{ github.sha }}" \
              --title "Karacast Mobil ${{ steps.version.outputs.name }}" \
              --notes-file /tmp/notes.txt \
              --latest=false
          fi

      - name: Update-Datei auf main umschreiben
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          url="https://github.com/${{ github.repository }}/releases/download/$tag/${{ steps.apk.outputs.name }}"

          python3 - "$url" > /tmp/karacast-mobile.json <<'PY'
          import json, sys, pathlib
          notes = pathlib.Path('/tmp/notes.txt').read_text(encoding='utf-8').strip()
          print(json.dumps({
              "versionCode": int("${{ steps.version.outputs.code }}"),
              "versionName": "${{ steps.version.outputs.name }}",
              "url": sys.argv[1],
              "notes": notes,
          }, ensure_ascii=False, indent=2))
          PY

          # Die Datei liegt auf main, gebaut wurde eventuell aus einem Tag: der
          # Weg über die API schreibt genau dorthin, ohne zweites Auschecken.
          sha=$(gh api "repos/${{ github.repository }}/contents/update/karacast-mobile.json?ref=main" --jq .sha 2>/dev/null || true)
          args=(-X PUT "repos/${{ github.repository }}/contents/update/karacast-mobile.json"
                -f message="Karacast Mobil: Update auf ${{ steps.version.outputs.name }}"
                -f branch=main
                -f content="$(base64 -w0 /tmp/karacast-mobile.json)")
          if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
          gh api "${args[@]}" --jq '.commit.html_url'

          echo "### Karacast Mobil ${{ steps.version.outputs.name }} ist draußen" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "APK: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Die Handys melden das Update beim nächsten Öffnen (einmal am Tag)." >> "$GITHUB_STEP_SUMMARY"

      - name: Schlüssel wieder wegräumen
        if: always()
        run: rm -f keystore/safir-release.jks keystore.properties /tmp/sig.rsa /tmp/manifest.bin
