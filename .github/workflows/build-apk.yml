#
# Bauen bei jedem Push: prüft, dass alles kompiliert, und legt die fertigen APKs
# zum Herunterladen ab (Actions → dieser Lauf → unten „Artifacts“) — die
# TV-App als „KaracastIPTV-…“, die Handy-App als „KaracastMobil-…“.
#
# Anders als „Veröffentlichen“ erfährt hier kein Fernseher etwas davon — das ist
# der Weg zum Ausprobieren. Ist der Signaturschlüssel als Secret hinterlegt, wird
# das Release-APK damit signiert und lässt sich direkt über die installierte App
# legen. Das Debug-APK heißt „com.safir.iptv.debug“ und installiert sich daneben.
#
name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        id: version
        run: |
          name=$(grep -m1 -E '^\s*versionName\s*=' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=${name:-unbekannt}" >> "$GITHUB_OUTPUT"

      - name: Signaturschlüssel bereitlegen (falls hinterlegt)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "Kein Schlüssel hinterlegt — das Release-APK wird mit dem Debug-Schlüssel signiert."
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/safir-release.jks
          {
            printf 'storeFile=keystore/safir-release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDirectDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleDirectRelease --no-daemon --stacktrace

      - name: APKs benennen
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/direct/release/*.apk "dist/KaracastIPTV-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/direct/debug/*.apk "dist/KaracastIPTV-${{ steps.version.outputs.name }}-test.apk"
          ls -lh dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: KaracastIPTV-${{ steps.version.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      # ------------------------------------------------------ Karacast Mobil
      # Nach der TV-App und getrennt hochgeladen: scheitert die Handy-App, liegt
      # das TV-APK trotzdem zum Herunterladen bereit.

      - name: Version der Handy-App lesen
        id: mobile
        run: |
          name=$(grep -m1 -E '^\s*versionName\s*=' mobile/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "name=${name:-unbekannt}" >> "$GITHUB_OUTPUT"

      - name: Handy-App bauen
        run: ./gradlew :mobile:assembleDirectDebug :mobile:assembleDirectRelease --no-daemon --stacktrace

      - name: Handy-APKs benennen
        run: |
          set -euo pipefail
          mkdir -p dist-mobile
          cp mobile/build/outputs/apk/direct/release/*.apk "dist-mobile/KaracastMobil-${{ steps.mobile.outputs.name }}.apk"
          cp mobile/build/outputs/apk/direct/debug/*.apk "dist-mobile/KaracastMobil-${{ steps.mobile.outputs.name }}-test.apk"
          ls -lh dist-mobile

      - name: Handy-APKs hochladen
        uses: actions/upload-artifact@v4
        with:
          name: KaracastMobil-${{ steps.mobile.outputs.name }}
          path: dist-mobile/*.apk
          if-no-files-found: error

      - name: Schlüssel wieder wegräumen
        if: always()
        run: rm -f keystore/safir-release.jks keystore.properties
